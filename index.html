
<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitrin | پنل مدیریت رستوران</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              app: {
                bg: 'var(--app-bg)',
                'bg-subtle': 'var(--app-bg-subtle)',
                surface: 'var(--app-surface)',
                'surface-elevated': 'var(--app-surface-elevated)',
                'surface-inset': 'var(--app-surface-inset)',
                'surface-hover': 'var(--app-surface-hover)',
                text: 'var(--app-text)',
                'text-muted': 'var(--app-text-muted)',
                'text-subtle': 'var(--app-text-subtle)',
                border: 'var(--app-border)',
                'border-strong': 'var(--app-border-strong)',
                accent: 'var(--app-accent)',
                'accent-strong': 'var(--app-accent-strong)',
                'accent-soft': 'var(--app-accent-soft)',
                grid: 'var(--app-grid)',
                'grid-node': 'var(--app-grid-node)'
              },
              slate: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                750: '#1e1e22',
                800: '#26262b',
                850: '#18181c',
                900: '#121212',
                950: '#0a0a0a',
              },
              emerald: {
                850: '#064e3b',
              },
              rose: {
                850: '#9f1239',
              }
            }
          }
        }
      }
      try {
        var savedTheme = localStorage.getItem('vitrin_theme');
        var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --page-bg: #F5F7F6;
        --surface-bg: #FFFFFF;

        --text-primary: #151817;
        --text-secondary: #626A66;
        --text-tertiary: #8A938E;

        --border: rgba(17, 31, 24, 0.08);
        --border-strong: rgba(17, 31, 24, 0.14);

        --accent: #10B981;
        --accent-strong: #059669;
        --accent-soft: rgba(16, 185, 129, 0.10);

        --grid-line: rgba(5, 150, 105, 0.035);
        --grid-node: rgba(5, 150, 105, 0.14);
        --cursor-glow: rgba(16, 185, 129, 0.05);

        /* Map legacy variables to prevent breakages */
        --app-bg: var(--page-bg);
        --app-bg-subtle: #EEF2F0;
        --app-surface: var(--surface-bg);
        --app-surface-elevated: var(--surface-bg);
        --app-surface-inset: #F2F5F3;
        --app-surface-hover: #F8FBF9;
        --app-text: var(--text-primary);
        --app-text-muted: var(--text-secondary);
        --app-text-subtle: var(--text-tertiary);
        --app-border: var(--border);
        --app-border-strong: var(--border-strong);
        --app-accent: var(--accent);
        --app-accent-strong: var(--accent-strong);
        --app-accent-soft: var(--accent-soft);
        --app-grid: var(--grid-line);
        --app-grid-node: var(--grid-node);

        /* Shared layout and responsive variables */
        --app-header: rgba(255, 255, 255, 0.85);
        --app-header-border: rgba(17, 31, 24, 0.08);
        --app-header-input: #F2F5F3;
        --app-header-text: #151817;
        --app-header-elevated: #FFFFFF;
        --app-header-control: #FFFFFF;
        --app-header-control-hover: #F8FBF9;
        --app-header-muted: #626A66;

        --header-height: 80px;
        --mobile-header-height: 64px;
        --sidebar-width-expanded: 260px;
        --sidebar-width-collapsed: 80px;
        --content-padding: 32px;
        --mobile-content-padding: 16px;
        --touch-target-size: 44px;
        --safe-area-padding: 16px;
        --page-max-width: 1400px;
        --modal-inset: 16px;
      }

      .dark {
        --page-bg: #070A09;
        --surface-bg: #101512;

        --text-primary: #F3F7F4;
        --text-secondary: #A0AAA4;
        --text-tertiary: #727D76;

        --border: rgba(255, 255, 255, 0.07);
        --border-strong: rgba(255, 255, 255, 0.12);

        --accent: #19C78C;
        --accent-strong: #20D99A;
        --accent-soft: rgba(25, 199, 140, 0.11);

        --grid-line: rgba(45, 212, 157, 0.035);
        --grid-node: rgba(45, 212, 157, 0.15);
        --cursor-glow: rgba(25, 199, 140, 0.075);

        /* Map legacy variables to prevent breakages */
        --app-bg: var(--page-bg);
        --app-bg-subtle: #0B0F0D;
        --app-surface: var(--surface-bg);
        --app-surface-elevated: #141A16;
        --app-surface-inset: #090D0B;
        --app-surface-hover: #18201B;
        --app-text: var(--text-primary);
        --app-text-muted: var(--text-secondary);
        --app-text-subtle: var(--text-tertiary);
        --app-border: var(--border);
        --app-border-strong: var(--border-strong);
        --app-accent: var(--accent);
        --app-accent-strong: var(--accent-strong);
        --app-accent-soft: var(--accent-soft);
        --app-grid: var(--grid-line);
        --app-grid-node: var(--grid-node);

        --app-header: rgba(16, 21, 18, 0.85);
        --app-header-border: rgba(255, 255, 255, 0.07);
        --app-header-input: #141A16;
        --app-header-text: #F3F7F4;
        --app-header-elevated: #101512;
        --app-header-control: #101512;
        --app-header-control-hover: #18201B;
        --app-header-muted: #A0AAA4;
      }

      body {
        font-family: 'Vazirmatn', 'Inter', sans-serif;
        background-color: var(--app-bg);
        color: var(--app-text);
        overflow-x: hidden;
      }
      html, body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Custom scrollbar for a cleaner SaaS look */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3); /* Low opacity Slate for Light theme */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.5);
      }
      
      /* Dark theme overrides for WebKit scrollbars */
      .dark ::-webkit-scrollbar-thumb,
      .dark::-webkit-scrollbar-thumb,
      html.dark ::-webkit-scrollbar-thumb,
      html.dark::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12); /* Low opacity White for Dark theme */
      }
      .dark ::-webkit-scrollbar-thumb:hover,
      .dark::-webkit-scrollbar-thumb:hover,
      html.dark ::-webkit-scrollbar-thumb:hover,
      html.dark::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      /* Firefox support */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.3) transparent;
      }
      .dark, .dark *, html.dark * {
        scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      @keyframes pulse-emerald {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      .animate-pulse-emerald {
        animation: pulse-emerald 2s infinite ease-in-out;
      }
      /* Remove default focus outlines on SVGs and Recharts interactive wrappers */
      svg, svg *, .recharts-wrapper, .recharts-wrapper *, .recharts-surface, .recharts-surface *:focus {
        outline: none !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent;
      }
      /* Dynamic classes for the brand glow effect across the app */
      .glow-emerald:hover {
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.15), 0 0 12px 2px rgba(16, 185, 129, 0.1) !important;
        border-color: rgba(16, 185, 129, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-blue:hover {
        box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15), 0 0 12px 2px rgba(59, 130, 246, 0.1) !important;
        border-color: rgba(59, 130, 246, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-purple:hover {
        box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.15), 0 0 12px 2px rgba(168, 85, 247, 0.1) !important;
        border-color: rgba(168, 85, 247, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-orange:hover {
        box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.15), 0 0 12px 2px rgba(249, 115, 22, 0.1) !important;
        border-color: rgba(249, 115, 22, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-red:hover {
        box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.15), 0 0 12px 2px rgba(239, 68, 68, 0.1) !important;
        border-color: rgba(239, 68, 68, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-violet:hover {
        box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 0 12px 2px rgba(139, 92, 246, 0.1) !important;
        border-color: rgba(139, 92, 246, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-pink:hover {
        box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.15), 0 0 12px 2px rgba(236, 72, 153, 0.1) !important;
        border-color: rgba(236, 72, 153, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-zinc:hover {
        box-shadow: 0 10px 25px -5px rgba(113, 113, 122, 0.15), 0 0 12px 2px rgba(113, 113, 122, 0.1) !important;
        border-color: rgba(113, 113, 122, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-slate:hover {
        box-shadow: 0 10px 25px -5px rgba(100, 116, 139, 0.15), 0 0 12px 2px rgba(100, 116, 139, 0.1) !important;
        border-color: rgba(100, 116, 139, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-transition {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      
      /* Global dark mode overrides for legacy hardcoded colors */
      .dark .bg-white {
        background-color: var(--app-surface) !important;
      }
      .dark .bg-slate-50 {
        background-color: var(--app-bg-subtle) !important;
      }
      .dark .bg-\[\#F7F7F8\] {
        background-color: var(--app-bg) !important;
      }
      .dark .bg-\[\#0A0A0A\] {
        background-color: var(--app-bg) !important;
      }
      .dark .text-slate-900 {
        color: var(--app-text) !important;
      }
      .dark .text-slate-800 {
        color: var(--app-text) !important;
      }
      .dark .text-slate-700 {
        color: var(--app-text-muted) !important;
      }
      .dark .text-slate-600 {
        color: var(--app-text-subtle) !important;
      }
      .dark .text-slate-500 {
        color: var(--app-text-subtle) !important;
      }
      .dark .text-\[\#18181B\] {
        color: var(--app-text) !important;
      }
      .dark .text-\[\#71717A\] {
        color: var(--app-text-muted) !important;
      }
      .dark .border-slate-200 {
        border-color: var(--app-border) !important;
      }
      .dark .border-slate-100 {
        border-color: var(--app-border) !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {

</script>

</head>

    <div id="root"></div>

</body>

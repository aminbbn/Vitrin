
<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitrin | پنل مدیریت رستوران</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              app: {
                bg: 'var(--app-bg)',
                'bg-subtle': 'var(--app-bg-subtle)',
                surface: 'var(--app-surface)',
                'surface-elevated': 'var(--app-surface-elevated)',
                'surface-inset': 'var(--app-surface-inset)',
                'surface-hover': 'var(--app-surface-hover)',
                text: 'var(--app-text)',
                'text-muted': 'var(--app-text-muted)',
                'text-subtle': 'var(--app-text-subtle)',
                border: 'var(--app-border)',
                'border-strong': 'var(--app-border-strong)',
                accent: 'var(--app-accent)',
                'accent-strong': 'var(--app-accent-strong)',
                'accent-soft': 'var(--app-accent-soft)',
                grid: 'var(--app-grid)',
                'grid-node': 'var(--app-grid-node)'
              },
              slate: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                750: '#1e1e22',
                800: '#26262b',
                850: '#18181c',
                900: '#121212',
                950: '#0a0a0a',
              },
              emerald: {
                850: '#064e3b',
              },
              rose: {
                850: '#9f1239',
              }
            }
          }
        }
      }
      try {
        var savedTheme = localStorage.getItem('vitrin_theme');
        var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --app-bg: #F5F7F6;
        --app-bg-subtle: #EEF2F0;
        --app-surface: #FFFFFF;
        --app-surface-elevated: #FFFFFF;
        --app-surface-inset: #F2F5F3;
        --app-surface-hover: #F8FBF9;
        --app-text: #161917;
        --app-text-muted: #626A66;
        --app-text-subtle: #8A938E;
        --app-border: rgba(17, 31, 24, 0.08);
        --app-border-strong: rgba(17, 31, 24, 0.14);
        --app-accent: #10B981;
        --app-accent-strong: #059669;
        --app-accent-soft: rgba(16, 185, 129, 0.08);
        --app-grid: rgba(13, 94, 70, 0.045);
        --app-grid-node: rgba(16, 185, 129, 0.16);
      }

      .dark {
        --app-bg: #070A09;
        --app-bg-subtle: #0B0F0D;
        --app-surface: #101512;
        --app-surface-elevated: #141A16;
        --app-surface-inset: #090D0B;
        --app-surface-hover: #18201B;
        --app-text: #F3F7F4;
        --app-text-muted: #A0AAA4;
        --app-text-subtle: #6F7A74;
        --app-border: rgba(255, 255, 255, 0.07);
        --app-border-strong: rgba(255, 255, 255, 0.12);
        --app-accent: #19C78C;
        --app-accent-strong: #20D99A;
        --app-accent-soft: rgba(25, 199, 140, 0.11);
        --app-grid: rgba(45, 213, 158, 0.035);
        --app-grid-node: rgba(45, 213, 158, 0.14);
      }

      body {
        font-family: 'Vazirmatn', 'Inter', sans-serif;
        background-color: var(--app-bg);
        color: var(--app-text);
        overflow-x: hidden;
      }
      html, body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Custom scrollbar for a cleaner SaaS look */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3); /* Low opacity Slate for Light theme */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.5);
      }
      
      /* Dark theme overrides for WebKit scrollbars */
      .dark ::-webkit-scrollbar-thumb,
      .dark::-webkit-scrollbar-thumb,
      html.dark ::-webkit-scrollbar-thumb,
      html.dark::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12); /* Low opacity White for Dark theme */
      }
      .dark ::-webkit-scrollbar-thumb:hover,
      .dark::-webkit-scrollbar-thumb:hover,
      html.dark ::-webkit-scrollbar-thumb:hover,
      html.dark::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      /* Firefox support */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.3) transparent;
      }
      .dark, .dark *, html.dark * {
        scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      @keyframes pulse-emerald {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      .animate-pulse-emerald {
        animation: pulse-emerald 2s infinite ease-in-out;
      }
      /* Remove default focus outlines on SVGs and Recharts interactive wrappers */
      svg, svg *, .recharts-wrapper, .recharts-wrapper *, .recharts-surface, .recharts-surface *:focus {
        outline: none !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent;
      }
      /* Dynamic classes for the brand glow effect across the app */
      .glow-emerald:hover {
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.15), 0 0 12px 2px rgba(16, 185, 129, 0.1) !important;
        border-color: rgba(16, 185, 129, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-blue:hover {
        box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15), 0 0 12px 2px rgba(59, 130, 246, 0.1) !important;
        border-color: rgba(59, 130, 246, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-purple:hover {
        box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.15), 0 0 12px 2px rgba(168, 85, 247, 0.1) !important;
        border-color: rgba(168, 85, 247, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-orange:hover {
        box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.15), 0 0 12px 2px rgba(249, 115, 22, 0.1) !important;
        border-color: rgba(249, 115, 22, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-red:hover {
        box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.15), 0 0 12px 2px rgba(239, 68, 68, 0.1) !important;
        border-color: rgba(239, 68, 68, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-violet:hover {
        box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 0 12px 2px rgba(139, 92, 246, 0.1) !important;
        border-color: rgba(139, 92, 246, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-pink:hover {
        box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.15), 0 0 12px 2px rgba(236, 72, 153, 0.1) !important;
        border-color: rgba(236, 72, 153, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-zinc:hover {
        box-shadow: 0 10px 25px -5px rgba(113, 113, 122, 0.15), 0 0 12px 2px rgba(113, 113, 122, 0.1) !important;
        border-color: rgba(113, 113, 122, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-slate:hover {
        box-shadow: 0 10px 25px -5px rgba(100, 116, 139, 0.15), 0 0 12px 2px rgba(100, 116, 139, 0.1) !important;
        border-color: rgba(100, 116, 139, 0.4) !important;
        transform: translateY(-2px);
      }
      .glow-transition {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
    </style>

{

</script>

</head>
